# FastAPI API on Fly.io — deploy from repo root:
#   fly launch --copy-config --no-deploy   # first time only
#   fly deploy
# Docs: docs/API_DEPLOYMENT.md

app = "dc-copilot-api"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile.api"

[env]
  PORT = "8080"
  KB_INGEST_SYNC = "true"
  KB_SHARED_MODE = "true"
  KB_SHARED_TENANT_KEY = "dc-copilot-shared"
  KB_STORAGE_BUCKET = "kb-assets"
  KB_EMBEDDING_MODEL = "text-embedding-3-large"
  KB_EMBEDDING_DIMENSIONS = "1536"
  CORS_ALLOWED_ORIGINS = "https://aim-set-2-0-web.vercel.app,http://localhost:3000,http://localhost:3002"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
