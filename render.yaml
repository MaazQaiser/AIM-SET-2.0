# Render Blueprint — API only (web stays on Vercel)
# Dashboard: New → Blueprint → connect this repo
# Docs: docs/API_DEPLOYMENT.md

services:
  - type: web
    name: dc-copilot-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: KB_INGEST_SYNC
        value: "true"
      - key: KB_SHARED_MODE
        value: "true"
      - key: KB_SHARED_TENANT_KEY
        value: "dc-copilot-shared"
      - key: KB_STORAGE_BUCKET
        value: "kb-assets"
      - key: KB_EMBEDDING_MODEL
        value: "text-embedding-3-large"
      - key: KB_EMBEDDING_DIMENSIONS
        value: "1536"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://aim-set-2-0-web.vercel.app,http://localhost:3000,http://localhost:3002"
      # Set these in Render Dashboard → Environment (do not commit secrets):
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: INTERNAL_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PUBLIC_API_BASE_URL
        sync: false
      - key: RECALL_API_KEY
        sync: false
      - key: RECALL_REGION
        value: "us-west-2"
      - key: RECALL_WEBHOOK_SECRET
        sync: false
      - key: DEMO_TRANSCRIPT_REPLAY
        value: "false"
